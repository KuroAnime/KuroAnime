<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuroAnime - Streaming Hub</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #1a1c23;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-secondary: #a0a0a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: rgba(15, 16, 21, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #2a2d3d;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .search-container {
            flex: 0 1 400px;
        }

        .search-bar {
            width: 100%;
            padding: 10px 15px;
            background-color: var(--card-bg);
            border: 1px solid #2a2d3d;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar:focus {
            border-color: var(--accent-color);
        }

        main {
            padding: 30px 5%;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .anime-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid #2a2d3d;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-color: var(--accent-color);
        }

        .anime-poster {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #252836;
        }

        .anime-info {
            padding: 15px;
        }

        .anime-title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .anime-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">KUROANIME</div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search anime..." onkeyup="filterAnime()">
        </div>
    </header>

    <main>
        <h2 class="section-title">Trending Now</h2>
        <div class="anime-grid" id="animeGrid">
            <!-- Sample Card 1 -->
            <div class="anime-card">
                <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500" alt="Anime Poster" class="anime-poster">
                <div class="anime-info">
                    <div class="anime-title">Cyberpunk Action</div>
                    <div class="anime-meta">Episode 1 • Sub/Dub</div>
                </div>
            </div>
            <!-- Sample Card 2 -->
            <div class="anime-card">
                <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500" alt="Anime Poster" class="anime-poster">
                <div class="anime-info">
                    <div class="anime-title">Mystic Chronicles</div>
                    <div class="anime-meta">Episode 12 • Sub</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function filterAnime() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('anime-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByClassName('anime-title')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
